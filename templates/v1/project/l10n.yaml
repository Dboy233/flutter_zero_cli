# ============================================================
# Flutter l10n 代码生成配置 / Flutter l10n code generation config
# 文档 / Docs: https://docs.flutter.dev/ui/accessibility-and-internationalization/internationalization
# ============================================================

# ARB 翻译文件所在目录。
# Directory containing the ARB translation files.
arb-dir: lib/l10n

# 模板 ARB 文件名——其他语言会对照它检查缺失的 key。
# Template ARB file — other locales are checked against it for missing keys.
template-arb-file: app_en.arb

# 生成的主 Dart 文件名（默认 app_localizations.dart）。
# Name of the generated main Dart file (default: app_localizations.dart).
# output-localization-file: app_localizations.dart

# 生成的本地化类名（默认 AppLocalizations）。
# Name of the generated localization class (default: AppLocalizations).
# output-class: AppLocalizations

# 生成文件输出目录（默认 .dart_tool/flutter_gen）。
# Output directory for generated files (default: .dart_tool/flutter_gen).
output-dir: lib/l10n/gen

# of() 方法返回非空类型，无需手动加 `!`。
# of() returns non-nullable type, no need for manual `!`.
nullable-getter: false

# 应用启动时的首选语言优先级（从高到低）。
# Preferred locale priority order on app launch (high to low).
# preferred-supported-locales:
#   - en
#   - zh

# 生成文件头部注释内容（直接写文本）。
# Header comment text to prepend to generated files (inline text).
# header: "// Generated by flutter gen-l10n. Do not modify."

# 从文件读取头部注释内容。
# Read header comment content from a file.
# header-file: l10n_header.txt

# 按需延迟加载翻译文件（减少首包体积，适合多语言大型应用）。
# Lazy-load translation files on demand (reduces initial bundle size).
# use-deferred-loading: false

# 强制每个 ARB key 都必须声明 @description 属性。
# Require every ARB key to declare an @description attribute.
# required-resource-attributes: false

# 将未翻译的 key 输出到指定文件（便于检查翻译遗漏）。
# Output untranslated keys to the specified file.
# untranslated-messages-file: untranslated.txt
