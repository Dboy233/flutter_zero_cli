name: flutter_zero_template
description: "A Flutter template project with MVI architecture, Dio, BLoC, go_router and common utilities."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  cupertino_icons: ^1.0.8
  dio: ^5.10.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_easyloading: ^3.0.5
  flutter_hooks: ^0.21.3+1
  flutter_localizations:
    sdk: flutter
  flutter_screenutil: ^5.9.3
  flutter_secure_storage: ^10.3.1
  freezed_annotation: ^3.1.0
  get_it: ^9.2.1
  go_router: ^17.3.0
  intl: ^0.20.2
  json_annotation: ^4.12.0
  logger: ^2.7.0
  meta: ^1.16.0
  pretty_dio_logger: ^1.4.0
  shared_preferences: ^2.5.5
  toastification: ^3.2.0

dev_dependencies:
  build_runner: ^2.15.0
  flutter_test:
    sdk: flutter
  freezed: ^3.2.5
  json_serializable: ^6.14.0
  mocktail: ^1.0.4
  very_good_analysis: ^10.3.0

flutter:
  uses-material-design: true
  generate: true
