name: fluzer
description: CLI tool for scaffolding Flutter Zero template projects.
version: 1.1.3
repository: https://github.com/Dboy233/flutter_zero_cli
homepage: https://github.com/Dboy233/flutter_zero_cli
issue_tracker: https://github.com/Dboy233/flutter_zero_cli/issues
documentation: https://dboy233.github.io/flutter_zero_doc/

environment:
  sdk: ^3.12.2

# 命令行工具依赖 / CLI dependencies
dependencies:
  analyzer: '>=10.0.1 <15.0.0'
  archive: ^4.0.9
  args: ^2.7.0          # 命令行参数解析 / Command-line argument parsing
  codemod_recipe: ^0.1.0
  dart_style: ^3.1.0     # 生成代码格式化 / Generated code formatting
  dio: ^5.10.0
  mason: ^0.1.2
  mason_logger: ^0.3.5  # 彩色日志输出 / Colored console output
  path: ^1.9.1          # 路径操作 / Path manipulation
  slang: ^4.19.0
  yaml: ^3.1.2          # YAML 解析 / YAML parsing

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6

# 注册可执行命令 / Register executable commands
# dart pub global activate fluzer → fluzer new my_feature
executables:
  fluzer: fluzer
